record:
  repo_id: &repo_id "plates/stacking"
  # repo_id: &repo_id "scylearning/pick_greencube_into_trashbin" 
  # Suggested format: <hf_username>/<description>, description = task.description -> Verb_SourceObject_prep_TargetObject
  # e.g. Pick up the green cube and put it into the trash bin -> pick_greencube_into_trashbin
  user_notes: "init_pose: [0.392232, 0.104898, 0.355162, -3.14, 0.0, -1.57]; init_pose_range: [0.02, 0.02, 0.02, 0.0, 0.0, 0.0]; force_step_size: 0.04; force_fine_step_size: 0.015; force_rot_step_size: 0.05; force_fine_rot_step_size: 0.045; gripper_force: 20; gripper_speed: 100; description: 'Extinguish the alcohol lamp'" # any additional notes about the dataset
  fps: 30 # dataset and camera frame rate

  mode: "auto_pick_place" # "teleop" (human-driven, default) or "auto_pick_place" (scripted, see auto_pick_place below)

  robot:
    ip: &ip "192.168.2.155" # robot_ip
    use_gripper: &use_gripper True
    init_gripper: &init_gripper True # If False, skip DH gripper init_state/init_feedback
    close_threshold: 0.7 # threshold to determine gripper open/close
    gripper_bin_threshold: 0.98 # threshold to determine gripper is closed
    gripper_port: &gripper_port "/dev/ur5e_left_gripper" # gripper_port
    gripper_reverse: &gripper_reverse False # If gripper moves opposite, flip this value
    gripper_force: &gripper_force 20 # gripper force command
    gripper_speed: &gripper_speed 100 # gripper speed command
    debug: False # if True, robot will not execute arm actions, but gripper can still be controlled
    control_space: "position" # "position" or "force"; auto_pick_place needs "position" -- "force" caps motion at force_mode.force_limit below (was tuned for a delicate teleop task and throttled the scripted waypoint motion badly)
    reference_frame: "base" # "base" or "tcp"; tcp_pose fields store EE/flange pose after removing UR TCP offset
    # Reset/init position as joint angles [base, shoulder, elbow, wrist1, wrist2, wrist3] in DEGREES,
    # copied from the teach pendant (Move tab) with the arm at the desired init pose. Reached with moveJ.
    # Previous TCP init pose for reference: [0.2235, -0.4663, 0.1738, 3.14159, 0.0, 1.919]
    init_joints_deg: [116.39, -100.68, 115.75, -104.99, -89.89, 15.87] # e.g. [-90.0, -100.0, 110.0, -100.0, -90.0, 0.0]
    force_mode:
      hold_current_pose_on_idle: True # if True, hold the current actual TCP pose when no motion key is pressed
      kp: 1200
      kd: 600
      kp_rot: 2000
      kd_rot: 400
      rtde_freq: 100
      select_vector: [1, 1, 1, 0, 0, 1]
      force_limit: [2, 2, 2, 2, 2, 2]
      pos_delta: 0.048
      vel_delta: 4.0                                                                                                                                                                                                                                                                                                                                                                                    
      gain_scale: 1.5
      control_frame_euler_deg: &control_frame_euler_deg [0, 0, 0] # control frame xyz Euler orientation relative to the robot base, in degrees
    position_mode:
      speed: 0.2 # passed to servoL but ignored by it
      acceleration: 0.2 # passed to servoL but ignored by it
      joint_speed: 0.5 # rad/s, peak joint speed of the moveJ reset to init_joints_deg
      joint_acceleration: 0.5 # rad/s^2, joint acceleration of the moveJ reset; lower = gentler start/stop
      servo_time: 0.025 # scaled down from 0.05 to match the ~0.033s control period at fps=30 (was 0.05 for the ~0.067s period at fps=15); keep below the control period or servoL will chase a stale target
      lookahead_time: 0.1
      gain: 300
      max_pos_speed: 0.5 # m/s, hard cap on commanded TCP linear speed (default 0.25); also caps auto_pick_place streaming
      max_rot_speed: 1.0 # rad/s, hard cap on commanded TCP rotation speed (default 0.5)
    payload:
      mass: 1.5
      cog: [0.003, -0.021, 0.056]

  teleop:
    position_step_size: 0.01 # keyboard xyz target delta for position control
    force_step_size: 0.04 # keyboard xyz target delta for force control
    force_fine_step_size: 0.015 # keyboard xyz target delta for force control after / toggle
    position_rot_step_size: 0.05 # keyboard euler angle target delta for position control [rx, ry, rz]
    force_rot_step_size: 0.05 # keyboard euler angle target delta for force control [rx, ry, rz]
    force_fine_rot_step_size: 0.045 # keyboard euler angle target delta for force control after / toggle [rx, ry, rz]
    control_frame_euler_deg: *control_frame_euler_deg

  # Only used when mode: "auto_pick_place". pick_region/place_region are x/y
  # bounding boxes (meters, robot base frame; robot.reference_frame must be
  # "base") that positions are sampled from. Orientation is never separately
  # configured: every pick/place/loaded-object pose reuses whatever
  # orientation the robot actually has at robot.init_joints_deg (captured live at
  # the start of the run), so it can never drift from it.
  #
  # At the start of the run, the operator is asked how many objects will be
  # used. For each one: the arm holds at robot.init_joints_deg with the gripper
  # turned on for object_load_hold_s seconds so the operator can hand it the
  # object, then control switches to keyboard jog teleop so the operator can
  # move the (suctioned) object down onto the table wherever they like -
  # press the right arrow key to confirm placement. Wherever it's released
  # becomes that object's fixed height/starting position for the rest of the
  # run.
  #
  # After loading, episodes run automatically back-to-back with no manual
  # gates: each episode picks every loaded object up from wherever it
  # currently sits and places it at a fresh random spot inside place_region;
  # after each episode, the robot picks each object back up from where it was
  # just placed and sets it down at a fresh randomized spot inside pick_region
  # (undoing the episode, not recorded as data), then returns to
  # robot.init_joints_deg, then the next episode starts. Press Enter at any time to
  # stop gracefully after the current episode/setup step finishes.
  auto_pick_place:
    object_load_hold_s: 3.0 # seconds to hold the gripper on at the init pose while the operator hands over each object
    manual_place_time_sec: 300 # max time (s) the operator has to jog each object down and release it during loading
    # "auto": the robot puts every object back into pick_region between episodes.
    # "manual": before each episode (including the first, instead of the
    # loading above) arrange the objects by hand, press Enter, then jog the cup
    # down onto each object and press the right arrow key to teach where it is.
    # Works with either place_mode.
    scene_reset: "auto" # "auto" or "manual"

    pick_region:
      x_range: [0.09574162, 0.57866903]
      y_range: [-0.53, -0.23]
    pick_min_separation: 0.3 # m, was 0.05 for box, min distance enforced between objects in the pick region
    pick_place_region_clearance: 0.0 # m, pick spots closer than this to place_region (object center to the region's nearest point) are rejected; 0 = just not inside it, null = no check. ~one object diameter keeps put-back objects from touching ones placed at its edge
    shuffle_pick_order: true # randomize which object is picked first each episode

    # Each episode's placement point per object is sampled fresh from within
    # place_region, and re-sampled if it lands within place_min_separation of
    # an object already placed earlier in the same episode (so objects spread
    # out instead of stacking).
    # Either a box (x_range + y_range) or a point + randomization distance:
    #   center: [x, y] and radius: r -> each episode samples a spot uniformly
    #   within r meters of center (radius 0 = always exactly center).
    # The same works for pick_region.
    place_region:
      # x_range: [0.14, 0.27]
      # y_range: [-0.418, -0.47]
      center: [0.0452, -0.445] # with load_mode "stack": replaced at startup by the x/y of the hand-built stack you jog onto
      radius: 0.015 # must be set gto zero if stack is only partially manipulated
      exclusion_radius: 0.24 # m, pick spots (scene reset / stack unloading) within this distance of center are rejected; >= radius. = radius 0.015 + 2 x plate radius 0.10 + ~2.5 cm margin, so a put-back plate never touches the stack (overrides pick_place_region_clearance)
    place_min_separation: 0.05 # m, min distance enforced between placements in one episode (scatter only)
    place_sampling_max_attempts: 200 # placement resample attempts before giving up

    # place_mode "stack": one spot is sampled from place_region per episode and
    # every object is stacked there by dropping it: the place motion stops at
    # the fixed height stack_release_z and releases, so the arm never presses
    # into the stack (fine for light objects like plastic plates). The scene
    # reset then unstacks top-down: it approaches align_height above
    # stack_release_z and descends slowly with suction on until force contact
    # with the top object (requires force_stop_enabled).
    place_mode: "stack" # "scatter" (separate spot per object) or "stack"
    stack_release_z: 0.15 # m, base-frame TCP z where each stacked object is released; must clear the full stack plus the held object
    stack_descend_speed: 0.03 # m/s, peak speed of the reset's unstacking descent (contact can happen mid-profile, so keep it slow)
    # load_mode "per_object": hand over / teach each object separately (default).
    # "stack": stack all objects anywhere by hand and only jog the cup onto the
    # top one; the robot unstacks them into pick_region (with scene_reset
    # "manual" this replaces each per-object teach too). At startup it asks
    # how many objects are in the stack (n) and how many to pick off the top
    # (k <= n); the other n - k stay as a base that episodes stack the k back
    # onto. Each picked object's table height = stack top - (n - 1) *
    # stack_plate_pitch; a bit too large is
    # safe (the force-stop descent catches the table), too small drops plates
    # from that much too high. Requires force_stop_enabled.
    load_mode: "stack" # "per_object" or "stack"
    stack_plate_pitch: 0.01 # m, height each object adds to a stack -- MEASURE: (stack of n height - one object height) / (n - 1)

    # Motion: every move follows a minimum-jerk (bell-shaped speed) profile.
    # Transit arcs up to approach_height above the higher endpoint and ends
    # align_height above the object; the rest is a slow force-stop descent.
    approach_height: 0.14 #  m was 0.16 fro box , transit arc height above the higher of pick/place, and retreat height after release
    align_height: 0.05 # m, where transit ends and the slow descent starts
    transit_speed_range: [0.15, 0.30] # m/s, peak transit speed, resampled once per episode
    descend_speed: 0.04 # m/s, peak speed of the final descent and the first lift off the table
    rot_speed: 0.6 # rad/s, peak rotation speed
    min_segment_s: 0.3 # s, shortest any single move may take
    max_step_size: 0.02 # m per tick, safety clamp on each commanded delta (on top of robot.position_mode.max_pos_speed)
    max_rot_step_size: 0.05 # rad per tick, safety clamp on each commanded rotation delta
    tracking_lead_s: 0.05 # s, how far ahead on the profile each tick aims, to make up for the arm lagging its command
    position_tolerance: 0.01 # was 0.003 m, a move is done once its profile ends and the arm is this close
    rotation_tolerance: 0.02 # rad
    settle_timeout_s: 1.5 # s after a profile ends to move on even if not within tolerance (logs a warning)
    align_settle_timeout_s: 5.0 # s, same but for the move that ends right above an object: the descent only starts once the arm is really above it (straight down, not at an angle)

    suction_lead_m: 0.003 # m above the object at which suction switches on during the descent
    grasp_seal_s: 0.25 # s, hold at the object after contact so the suction seal forms
    release_s: 0.25 # s, hold at the place point after switching suction off
    end_hold_s: 1.0 # s, hold still above the last placed object before the episode ends (a clear 'done' pattern); 0 disables

    force_stop_enabled: True # if True, stop the downward pick/place move early on TCP force contact instead of servoing to the assumed depth
    contact_force_threshold: 10.0 # N, TCP force magnitude that counts as "touched the object"
    force_stop_clearance_height: 0.02 # m, slow straight-up lift right after grasping, before the transit arc

    # Recovery demonstrations (recorded as phase PERTURB -> CORRECT; PERTURB
    # frames are dropped at training time, see configs/phase_weights.yaml).
    # Never used during scene resets.
    misalign_prob: 0.25 # per approach (pick and place): end transit off target, start down, then correct
    misalign_range: [0.015, 0.03] # m, horizontal misalignment
    miss_grasp_prob: 0.1 # per pick: go down beside the object, suction on, lift, suction off, retry
    miss_offset: 0.13 # m beside the object center; must exceed the object's half-width (plates: 0.10) plus the cup radius, or the "missed" grasp lands on the plate
    correct_speed: 0.06 # m/s, peak speed of the correcting move

  task:
    description: "place the tupperware in the position marked with the blue square" # task description
    num_episodes: 10 # number of episodes to record
    display: True # Whether to display the data during recording
    resume: True
    # resume_dataset: scylearning/extinguish_alcohol_lamp_20260801_v01 # dataset to resume from if resume is True
    resume_dataset: plates/stacking_20261029_v13

  time:
    episode_time_sec: 600 # max time per episode in seconds
    reset_time_sec: 600 # max time to reset between episodes in seconds
    save_meta_period: 1 # Save metadata after every N episodes

  cameras:
    enabled: True # if False, do not open RealSense hardware and use fixed dummy images
    wrist_cam_serial: "1944301051EED71200" # wrist camera serial number
    exterior_cam_serial: "19443010019DD81200" # exterior camera serial number
    width: 640 # camera and dummy-frame width; common values: 640, 424
    height: 360 # camera and dummy-frame height; kept at 16:9 (OAK sensor default resolution) to avoid center-cropping the preview; common values: 360, 720
    dummy_value: 0 # dummy RGB image intensity in [0, 255]

  storage:
    data_root: "/mnt/ssd/lerobot_data" # root dir for datasets (and calibration); sets HF_LEROBOT_HOME. Empty/null = default ~/.cache/huggingface/lerobot. A HF_LEROBOT_HOME already set in the shell overrides this
    push_to_hub: False # whether to push the dataset to your huggingface repo after recording
    encode_videos_at_end: False # save + encode all episodes once when the run ends (or stops/crashes) instead of after every episode; raw frames stay on disk as images until then

replay:
  repo_id: *repo_id
  episode_idx: 0 # episode index to replay
  robot:
    ip: *ip
    gripper_port: *gripper_port
    use_gripper: *use_gripper
    init_gripper: *init_gripper
    gripper_reverse: *gripper_reverse
    gripper_force: *gripper_force
    gripper_speed: *gripper_speed
    control_frame_euler_deg: *control_frame_euler_deg

visualize:
  dataset_name: scylearning/extinguish_alcohol_lamp_20260801_v01
  episode_index: 27 # episode index to visualize
  default_obs_group: "tcp_pose" # default observation group shown in the data window
  data_window: True # open a local browser window for per-frame action and selected observation data
  print_to_terminal: False # also print per-frame data to terminal

check_dataset:
  dataset_name: scylearning/test_20260516_v01

prune_episodes:
  old_dataset_name: scylearning/test_20260516_v01
  new_dataset_name: scylearning/test_20260516_v01_pruned
